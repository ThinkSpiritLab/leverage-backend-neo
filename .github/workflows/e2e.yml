name: E2E Tests

on:
  workflow_dispatch:  # 仅手动触发，节省 Actions 配额

jobs:
  e2e:
    name: E2E (testcontainers)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

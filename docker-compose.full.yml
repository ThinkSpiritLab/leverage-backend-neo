version: '3.9'

# Full-stack docker-compose for Leverage OJ
# Includes: Nginx (reverse proxy) + Frontend builder + Backend API + MariaDB + Redis
#
# Usage:
#   docker-compose -f docker-compose.full.yml up -d
#   Visit: http://localhost

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - app
      - frontend-builder
    restart: unless-stopped

  frontend-builder:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../leverage-frontend-neo:/app
      - frontend_dist:/app/.output/public
    command: sh -c "npm install -g pnpm && pnpm install && pnpm build"
    environment:
      NUXT_PUBLIC_API_BASE: /api

  app:
    build: .
    expose:
      - "3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_DATABASE:-leverage}
      MYSQL_USER: ${DB_USERNAME:-leverage}
      MYSQL_PASSWORD: ${DB_PASSWORD:-leveragepass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  frontend_dist:

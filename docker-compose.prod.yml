version: '3.8'

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Provide DB_ROOT_PASSWORD via --env-file .env.prod}
      MYSQL_DATABASE: ${DB_DATABASE:?Provide DB_DATABASE via --env-file .env.prod}
      MYSQL_USER: ${DB_USERNAME:?Provide DB_USERNAME via --env-file .env.prod}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Provide DB_PASSWORD via --env-file .env.prod}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Provide REDIS_PASSWORD via --env-file .env.prod}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: .
    # This container has no Docker daemon/socket; execution belongs to the worker.
    environment:
      BACKEND_ROLE: api
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file: .env.prod
    volumes:
      - testcases_data:/tmp/testcases
      - uploads_data:/tmp/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../leverage-frontend-neo
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    restart: unless-stopped


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  testcases_data:
  uploads_data:

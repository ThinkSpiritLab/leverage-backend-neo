<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Lite</title>
  <style>
    :root {
      --felt: #0e5a3a;
      --felt-dark: #083724;
      --panel: rgba(255, 248, 230, 0.94);
      --ink: #1b1b1b;
      --gold: #e0b44f;
      --win: #2f9e44;
      --lose: #c92a2a;
      --push: #d97706;
      --muted: #5c5c5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 30%),
        linear-gradient(180deg, var(--felt) 0%, var(--felt-dark) 100%);
    }

    .table {
      width: min(1100px, calc(100vw - 24px));
      margin: 12px auto;
      padding: 20px;
      border: 3px solid rgba(224, 180, 79, 0.6);
      border-radius: 28px;
      background: rgba(3, 34, 20, 0.42);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #fff9e8;
      margin-bottom: 18px;
    }

    .title {
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0.04em;
    }

    .meta {
      text-align: right;
      font-size: 14px;
      color: rgba(255, 249, 232, 0.9);
    }

    .dealer,
    .players {
      display: grid;
      gap: 14px;
    }

    .dealer {
      margin-bottom: 18px;
    }

    .players {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .seat {
      background: var(--panel);
      border-radius: 18px;
      padding: 16px;
      min-height: 180px;
      position: relative;
      overflow: hidden;
    }

    .seat::after {
      content: "";
      position: absolute;
      inset: auto -20% -45% auto;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(224, 180, 79, 0.14);
    }

    .seat-header {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .name {
      font-size: 20px;
      font-weight: 700;
    }

    .status {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(0, 0, 0, 0.08);
      color: var(--muted);
    }

    .status.win { background: rgba(47, 158, 68, 0.12); color: var(--win); }
    .status.lose, .status.bust { background: rgba(201, 42, 42, 0.12); color: var(--lose); }
    .status.push { background: rgba(217, 119, 6, 0.14); color: var(--push); }
    .status.playing, .status.stand { background: rgba(0, 0, 0, 0.08); color: #334155; }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card {
      width: 56px;
      height: 80px;
      border-radius: 10px;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 700;
    }

    .card.back {
      background:
        linear-gradient(135deg, #8b1e3f, #4d1023),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.12) 0 8px, rgba(255,255,255,0.03) 8px 16px);
      color: #fff;
    }

    .details {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 15px;
    }

    .empty {
      color: rgba(255, 249, 232, 0.9);
      text-align: center;
      padding: 48px 16px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main class="table">
    <section class="header">
      <div class="title">Blackjack Lite</div>
      <div class="meta" id="meta">Waiting for game data</div>
    </section>
    <section class="dealer" id="dealer"></section>
    <section class="players" id="players"></section>
  </main>

  <script>
    const metaEl = document.getElementById("meta");
    const dealerEl = document.getElementById("dealer");
    const playersEl = document.getElementById("players");

    function statusClass(status) {
      return String(status || "").toLowerCase();
    }

    function cardMarkup(value, hidden = false) {
      if (hidden) {
        return '<div class="card back">?</div>';
      }
      return `<div class="card">${value}</div>`;
    }

    function seatMarkup(name, hand, total, status, score, active) {
      const badge = status ? String(status).toUpperCase() : "WAIT";
      const scoreLine = score === null || score === undefined ? "" : `<div>Score: ${score}</div>`;
      const activeLine = active ? "<div>Turn: Active</div>" : "";
      return `
        <article class="seat">
          <div class="seat-header">
            <div class="name">${name}</div>
            <div class="status ${statusClass(status)}">${badge}</div>
          </div>
          <div class="cards">${hand.join("")}</div>
          <div class="details">
            <div>Total: ${total}</div>
            <div>${activeLine}${scoreLine}</div>
          </div>
        </article>
      `;
    }

    function render(display) {
      if (!display) {
        dealerEl.innerHTML = "";
        playersEl.innerHTML = '<div class="empty">No game loaded.</div>';
        return;
      }

      metaEl.textContent = `Phase: ${display.phase} | Deck: ${display.deckRemaining} cards | Target: ${display.target}`;

      const dealerCards = [];
      const visibleDealer = display.dealer.visibleHand || [];
      for (const value of visibleDealer) {
        dealerCards.push(cardMarkup(value));
      }
      if (display.dealer.hidden) {
        dealerCards.push(cardMarkup("?", true));
      }

      dealerEl.innerHTML = seatMarkup(
        "Dealer",
        dealerCards,
        display.dealer.total,
        display.dealer.hidden ? "hidden" : "revealed",
        "",
        false
      );

      playersEl.innerHTML = display.players.map((player) => {
        const cards = (player.hand || []).map((value) => cardMarkup(value));
        return seatMarkup(
          `Player ${player.id + 1}`,
          cards,
          player.total,
          player.status,
          player.score,
          display.currentPlayer === player.id && display.phase === "player_turn"
        );
      }).join("");
    }

    function extractDisplay(payload) {
      if (payload.type === "gameLog") {
        return payload.gameLog?.rounds?.[payload.round]?.display ?? payload.gameLog?.rounds?.[payload.round]?.judgeCmd?.display ?? null;
      }
      if (payload.type === "gameState") {
        try {
          const latest = JSON.parse(payload.gameState.requests[payload.gameState.requests.length - 1]);
          return latest.display || null;
        } catch (err) {
          return null;
        }
      }
      return null;
    }

    window.addEventListener("message", (event) => {
      const display = extractDisplay(event.data || {});
      if (display) {
        render(display);
      }
    });

    render(null);
  </script>
</body>
</html>

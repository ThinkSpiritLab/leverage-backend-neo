<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Auction</title>
  <style>
    :root {
      --bg: #f4efe4;
      --panel: rgba(255, 251, 245, 0.82);
      --ink: #1b1d21;
      --muted: #5b5f68;
      --accent: #b4452f;
      --accent-soft: #e6b583;
      --border: rgba(27, 29, 33, 0.12);
      --track: rgba(27, 29, 33, 0.08);
      --gold: #d98e04;
      --shadow: 0 20px 60px rgba(77, 42, 20, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(217, 142, 4, 0.22), transparent 30%),
        radial-gradient(circle at top right, rgba(180, 69, 47, 0.18), transparent 28%),
        linear-gradient(135deg, #f7f1e6, #ece2cf 55%, #efe8dd);
      padding: 24px;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    .hero,
    .panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
      align-items: center;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 0.95;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      max-width: 48ch;
      font-size: 16px;
      line-height: 1.5;
    }

    .card-stage {
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.88), rgba(233, 223, 210, 0.94));
      padding: 22px;
      min-height: 220px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .card-stage::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px dashed rgba(27, 29, 33, 0.12);
      border-radius: 18px;
    }

    .card-value {
      width: 160px;
      aspect-ratio: 4 / 5;
      border-radius: 24px;
      background: linear-gradient(145deg, #fff9f2, #f0dbc5);
      border: 2px solid rgba(180, 69, 47, 0.18);
      display: grid;
      place-items: center;
      font-size: 64px;
      font-weight: 700;
      color: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .card-label {
      position: absolute;
      bottom: 20px;
      left: 22px;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
    }

    .panel {
      padding: 22px;
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    .players {
      display: grid;
      gap: 14px;
    }

    .player {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.52);
    }

    .player-top,
    .stats,
    .round-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .player-top strong {
      font-size: 17px;
    }

    .stats {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      flex-wrap: wrap;
    }

    .budget {
      margin-top: 12px;
    }

    .budget-bar {
      height: 10px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }

    .budget-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
    }

    .budget-copy {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .history {
      display: grid;
      gap: 12px;
      max-height: 520px;
      overflow: auto;
      padding-right: 4px;
    }

    .round {
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 15px;
      background: rgba(255, 255, 255, 0.54);
    }

    .round strong {
      font-size: 16px;
    }

    .winner {
      color: var(--gold);
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .footer {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .hero,
      .grid {
        grid-template-columns: 1fr;
      }

      body {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <div class="eyebrow">Sealed Bid Arena</div>
        <h1 id="headline">Number Auction</h1>
        <p class="sub" id="subtitle">Waiting for match data.</p>
      </div>
      <div class="card-stage">
        <div class="card-value" id="cardValue">?</div>
        <div class="card-label" id="cardLabel">Awaiting round</div>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>Players</h2>
        <div class="players" id="players"></div>
      </div>
      <div class="panel">
        <h2>Round History</h2>
        <div class="history" id="history"></div>
      </div>
    </section>

    <div class="footer" id="footer">Replay updates appear here after each judge message.</div>
  </main>

  <script>
    const playersEl = document.getElementById("players");
    const historyEl = document.getElementById("history");
    const cardValueEl = document.getElementById("cardValue");
    const cardLabelEl = document.getElementById("cardLabel");
    const subtitleEl = document.getElementById("subtitle");
    const footerEl = document.getElementById("footer");

    function fmtCards(cards) {
      return cards.length ? cards.join(", ") : "none";
    }

    function render(display) {
      const players = Array.isArray(display.players) ? display.players : [];
      const history = Array.isArray(display.history) ? [...display.history].reverse() : [];
      const nextRound = display.nextRound;
      const currentCard = display.currentCard;

      subtitleEl.textContent = nextRound
        ? `Round ${nextRound} of ${display.totalRounds}. Highest unique bid wins the revealed card.`
        : `Auction complete after ${display.totalRounds} rounds. Final standings shown below.`;

      cardValueEl.textContent = currentCard == null ? "END" : currentCard;
      cardLabelEl.textContent = currentCard == null ? "Auction finished" : `Card up for Round ${nextRound}`;
      footerEl.textContent = history.length
        ? `Latest resolved round: ${history[0].round}. Budgets fall on every bid, win or lose.`
        : "No bids resolved yet.";

      playersEl.innerHTML = players.map((player) => {
        const budgetWidth = Math.max(0, Math.min(100, player.budget));
        return `
          <article class="player">
            <div class="player-top">
              <strong>Player ${player.id}</strong>
              <span>${player.score} pts</span>
            </div>
            <div class="stats">
              <span>Cards: ${fmtCards(player.cardsWon || [])}</span>
              <span>Budget: ${player.budget}</span>
            </div>
            <div class="budget">
              <div class="budget-bar">
                <div class="budget-fill" style="width: ${budgetWidth}%"></div>
              </div>
              <div class="budget-copy">${player.budget} / 100 coins left</div>
            </div>
          </article>
        `;
      }).join("");

      historyEl.innerHTML = history.map((round) => {
        const bidEntries = Object.entries(round.bids || {})
          .sort((a, b) => Number(a[0]) - Number(b[0]))
          .map(([pid, bid]) => `P${pid}: ${bid}`)
          .join(" | ");
        const winnerLine = round.winner == null
          ? `<span class="muted">No unique highest bid</span>`
          : `<span class="winner">Player ${round.winner} won with ${round.winningBid}</span>`;

        return `
          <article class="round">
            <div class="round-row">
              <strong>Round ${round.round}</strong>
              <span>Card ${round.cardValue}</span>
            </div>
            <p>${winnerLine}</p>
            <p class="muted">${bidEntries}</p>
          </article>
        `;
      }).join("");
    }

    function getDisplayFromMessage(data) {
      if (data.type === "gameLog") {
        return data.gameLog && data.gameLog.rounds && data.gameLog.rounds[data.round]
          ? data.gameLog.rounds[data.round].judgeCmd.display
          : null;
      }
      if (data.type === "gameState") {
        try {
          const latest = JSON.parse(data.gameState.requests[data.gameState.requests.length - 1]);
          return latest.display || null;
        } catch (error) {
          return null;
        }
      }
      return null;
    }

    window.addEventListener("message", (event) => {
      const display = getDisplayFromMessage(event.data || {});
      if (display) {
        render(display);
      }
    });
  </script>
</body>
</html>
